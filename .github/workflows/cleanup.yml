name: Cleanup Old Stories

on:
  schedule:
    - cron: '0 3 * * *'   # Daily at 03:00 UTC
  workflow_dispatch:        # Manual trigger from GitHub Actions tab

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete stories older than 7 days
        env:
          SUPABASE_URL:              ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          CUTOFF=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X DELETE \
            "${SUPABASE_URL}/rest/v1/stories?published_at=lt.${CUTOFF}" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Prefer: return=minimal")
          echo "Supabase responded: ${HTTP_STATUS}"
          if [ "${HTTP_STATUS}" != "204" ]; then
            echo "Unexpected status code: ${HTTP_STATUS}" >&2
            exit 1
          fi
